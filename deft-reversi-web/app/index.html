<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>Deft Reversi</title>
    <meta name="description" content="強いオセロAI（リバーシAI）" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <link rel="icon" href="assets/favicon.ico" />
    <style>
        :root {
            --bg-0: #ffffff;
            --bg-1: #f6fbf8;
            --panel: rgba(255, 255, 255, 0.78);
            --panel-2: rgba(255, 255, 255, 0.9);
            --surface: rgba(2, 6, 23, 0.045);
            --surface-2: rgba(2, 6, 23, 0.065);
            --text: rgba(15, 23, 42, 0.92);
            --muted: rgba(15, 23, 42, 0.62);
            --line: rgba(15, 23, 42, 0.11);
            --accent: #10b981;
            --accent-2: #34d399;
            --danger: #ef4444;
            --shadow: 0 10px 26px rgba(15, 23, 42, 0.12);

            /* Layout tokens */
            --page-max: 520px;
            --page-pad: 18px;
            --card-pad: 16px;

            /* Board layout */
            --board-gap: 1px;
            --board-pad: 8px;
            --coord-size: 12px;
            --coord-font: 11px;

            /* Board palette (mint/teal like reference) */
            --board-frame: rgba(211, 239, 230, 0.95);
            --board-gridline: rgba(18, 72, 60, 0.16);
            --board-tile: #8fd2bf;
            --board-tile-legal: #7fceb8;
            --board-outline: rgba(2, 6, 23, 0.16);
            --board-last-dot: rgba(239, 68, 68, 0.95);
            --board-next-opening: rgba(249, 115, 22, 0.95);
            --score-text: rgba(2, 6, 23, 0.86);
            --score-best: #2563eb;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family:
                ui-sans-serif,
                system-ui,
                -apple-system,
                'Segoe UI',
                Roboto,
                'Noto Sans JP',
                'Hiragino Kaku Gothic ProN',
                Meiryo,
                Arial,
                sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 30% 10%, rgba(16, 185, 129, 0.12), transparent 58%),
                radial-gradient(circle at 70% 70%, rgba(52, 211, 153, 0.1), transparent 62%),
                linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
            overflow: hidden;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        #app {
            height: 100%;
        }

        .app-shell {
            height: 100%;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px 8px;
        }

        .topbar h1 {
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.25em;
            font-size: 16px;
            opacity: 0.9;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
        }

        .mini-icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            font-weight: 700;
        }

        .content {
            padding: 8px var(--page-pad) 0;
            overflow: auto;
        }

        .page {
            max-width: var(--page-max);
            margin: 0 auto;
        }

        .page.page--home {
            min-height: calc(100vh - 140px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .page.page--board {
            max-width: 720px;
        }

        .page.page--board .card {
            padding: 12px;
        }

        .page.page--board .board-wrap {
            margin-top: 10px;
        }

        .card {
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.7));
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            padding: var(--card-pad);
        }

        .card + .card {
            margin-top: 14px;
        }

        .card small {
            color: var(--muted);
            letter-spacing: 0.05em;
        }

        .card-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .card-title strong {
            font-size: 20px;
            font-weight: 650;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-radius: 999px;
            border: 1px solid var(--line);
            padding: 6px 12px;
            background: var(--surface);
            color: var(--muted);
            font-size: 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.14);
        }

        .dot.ok {
            background: var(--accent);
        }

        .primary-btn {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 14px 16px;
	            background: linear-gradient(135deg, #10b981, #0ea371);
            color: white;
            font-weight: 650;
            letter-spacing: 0.06em;
            cursor: pointer;
	            box-shadow: 0 12px 26px rgba(16, 185, 129, 0.18);
	        }

        .secondary-btn {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
        }

        .tabs {
            display: flex;
            gap: 8px;
            padding: 6px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--surface);
        }

        .tab {
            flex: 1;
            padding: 10px 10px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .tab.active {
            background: rgba(16, 185, 129, 0.18);
            color: var(--text);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .section {
            margin-top: 14px;
            padding: 14px 14px;
            border-radius: 16px;
            background: var(--panel);
            border: 1px solid var(--line);
        }

        .section h2 {
            margin: 0 0 10px 0;
            font-size: 12px;
            letter-spacing: 0.12em;
            color: var(--muted);
            font-weight: 650;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .row + .row {
            margin-top: 10px;
        }

        .score-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
        }

        .score-side {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-center {
            justify-self: center;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .score-right {
            text-align: right;
        }

        @media (max-width: 420px) {
            .score-row {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
                row-gap: 14px;
            }
            .score-left {
                grid-column: 1;
                grid-row: 1;
            }
            .score-right {
                grid-column: 2;
                grid-row: 1;
            }
            .score-center {
                grid-column: 1 / -1;
                grid-row: 2;
                text-align: center;
                white-space: normal;
                margin-top: 2px;
            }
        }

        .chip {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
        }

        .chip.active {
            border-color: rgba(16, 185, 129, 0.38);
            background: rgba(16, 185, 129, 0.16);
        }

        .input,
        .select,
        .textarea {
            width: 100%;
            padding: 12px 12px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            outline: none;
        }

        .textarea {
            min-height: 84px;
            resize: vertical;
        }

        .board-wrap {
            margin-top: 14px;
            display: grid;
            place-items: center;
            position: relative;
        }

        .board-wrap.with-overlay {
            padding-top: 44px;
        }

        .board-overlay {
            position: absolute;
            top: 0;
            left: 10px;
            display: inline-flex;
            gap: 8px;
            align-items: center;
            z-index: 2;
        }

        .toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.7);
            color: var(--muted);
            cursor: pointer;
            user-select: none;
        }

        .toggle .track {
            width: 34px;
            height: 18px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.12);
            position: relative;
        }

        .toggle .knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.95);
            transition: transform 140ms ease;
        }

        .toggle.on {
            color: var(--text);
            border-color: rgba(16, 185, 129, 0.28);
            background: rgba(16, 185, 129, 0.12);
        }

        .toggle.on .track {
            background: rgba(16, 185, 129, 0.35);
        }

        .toggle.on .knob {
            transform: translateX(16px);
        }

        .board-shell {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: var(--coord-size) repeat(8, 1fr) var(--coord-size);
            grid-template-rows: var(--coord-size) repeat(8, 1fr) var(--coord-size);
            gap: var(--board-gap);
            padding: var(--board-pad);
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(211, 239, 230, 0.92), rgba(211, 239, 230, 0.86));
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.1);
        }

        .board-shell > * {
            min-width: 0;
            min-height: 0;
        }

        .cell {
            position: relative;
            border: none;
            border-radius: 0;
            background: var(--board-tile);
            cursor: pointer;
            padding: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            box-shadow: inset 0 0 0 1px var(--board-gridline);
        }

        .cell.legal {
            background: var(--board-tile-legal);
            box-shadow:
                inset 0 0 0 1px var(--board-gridline),
                inset 0 0 0 2px var(--board-outline);
        }

        .cell.next-opening {
            box-shadow:
                inset 0 0 0 1px var(--board-gridline),
                inset 0 0 0 2px var(--board-next-opening);
        }

        .cell.last-move::after {
            content: '';
            position: absolute;
            width: 10%;
            height: 10%;
            top: 7%;
            right: 7%;
            border-radius: 999px;
            background: var(--board-last-dot);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7);
            pointer-events: none;
        }

        .coord {
            display: grid;
            place-items: center;
            font-size: var(--coord-font);
            font-weight: 650;
            color: var(--muted);
            user-select: none;
            background: transparent;
        }

        .stone {
            position: absolute;
            inset: 10%;
            border-radius: 999px;
            box-shadow:
                0 8px 14px rgba(2, 6, 23, 0.16),
                inset 0 1px 2px rgba(255, 255, 255, 0.16);
        }

        .stone.black {
            background:
                radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 40%),
                radial-gradient(circle at 40% 40%, #2b2f36, #070a0e 70%);
        }

        .stone.white {
            background: radial-gradient(circle at 30% 25%, #ffffff, #e7eef6 70%);
            box-shadow:
                0 8px 14px rgba(2, 6, 23, 0.14),
                inset 0 1px 2px rgba(255, 255, 255, 0.55);
        }

        .score {
            font-size: 12px;
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--score-text);
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
            pointer-events: none;
            font-weight: 750;
        }

        .tabs-row {
            display: flex;
            justify-content: center;
            gap: 0;
            border-bottom: 1px solid var(--line);
            margin-top: 10px;
        }

        .tabs-row button {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 8px;
            color: var(--muted);
            font-weight: 650;
            letter-spacing: 0.08em;
            cursor: pointer;
        }

        .tabs-row button.active {
            color: var(--text);
            border-bottom: 2px solid rgba(16, 185, 129, 0.7);
        }

        .graph {
            width: 100%;
            height: 120px;
            border-radius: 14px;
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 10px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            max-width: min(92vw, 520px);
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid var(--line);
            color: var(--text);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.14);
            display: none;
            z-index: 50;
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.35);
            background: rgba(254, 226, 226, 0.95);
        }

        .hidden {
            display: none !important;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.25);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 80;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            width: min(560px, 100%);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.86));
            border: 1px solid var(--line);
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.16);
            padding: 16px;
        }

        .modal-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .modal-title strong {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .divider {
            height: 1px;
            background: var(--line);
            margin: 10px 0;
        }

        .mini {
            font-size: 12px;
            color: var(--muted);
        }

        .controls-bar {
            padding: 12px 12px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            box-shadow: 0 18px 44px rgba(15, 23, 42, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 16px;
        }

        .controls-bar .row {
            margin-top: 0;
        }

        .controls-row {
            display: grid;
            grid-template-columns: auto auto 1fr 1fr;
            align-items: center;
            gap: 10px;
        }

        @media (max-width: 420px) {
            .controls-row {
                grid-template-columns: auto auto;
            }
        }

        .controls-btn {
            height: 34px;
            padding: 0 12px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
            transition:
                transform 120ms ease,
                background-color 120ms ease,
                border-color 120ms ease,
                box-shadow 120ms ease;
        }

        .controls-btn.wide {
            width: 100%;
            justify-self: stretch;
            text-align: center;
        }

	        .controls-btn:hover {
	            transform: translateY(-1px);
	            border-color: rgba(15, 23, 42, 0.2);
	            background: rgba(15, 23, 42, 0.05);
	            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.12);
	        }

        .controls-btn:active {
            transform: translateY(0px);
            box-shadow: none;
        }

	        .controls-btn.active {
	            border-color: rgba(16, 185, 129, 0.34);
	            background: rgba(16, 185, 129, 0.16);
	            box-shadow: 0 10px 22px rgba(16, 185, 129, 0.1);
	        }

        .controls-icon {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 12px;
            transition:
                transform 120ms ease,
                background-color 120ms ease,
                border-color 120ms ease,
                box-shadow 120ms ease;
        }

        .controls-icon:hover {
            transform: translateY(-1px);
            border-color: rgba(15, 23, 42, 0.2);
            background: rgba(15, 23, 42, 0.05);
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.12);
        }

        .controls-icon:active {
            transform: translateY(0px);
            box-shadow: none;
        }

        .controls-btn:focus-visible,
        .controls-icon:focus-visible,
        .secondary-btn:focus-visible,
        .primary-btn:focus-visible,
        .icon-btn:focus-visible,
        .cell:focus-visible {
            outline: 2px solid rgba(16, 185, 129, 0.55);
            outline-offset: 2px;
        }

        @media (max-width: 520px) {
            :root {
                --page-pad: 8px;
                --card-pad: 12px;
                --board-pad: 4px;
                --coord-size: 10px;
                --coord-font: 10px;
            }
            .topbar {
                padding: 12px var(--page-pad) 8px;
            }
            .board-overlay {
                left: 8px;
            }
            .page.page--board .card {
                padding: 10px;
            }
        }

        .analysis-toolbar {
            margin-top: 12px;
            padding: 10px 10px;
            border-radius: 16px;
            background: var(--panel);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .analysis-toolbar-left {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .analysis-toolbar .controls-btn {
            height: 34px;
            padding: 0 12px;
            border-radius: 999px;
        }

        .toolbar-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            align-items: center;
        }

        .toolbar-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .analysis-toolbar button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .analysis-ply-input {
            width: 64px;
            height: 34px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            text-align: center;
            outline: none;
        }
    </style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./index.js"></script>
</body>
</html>
