<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>Deft Reversi</title>
    <meta name="description" content="強いオセロAI（リバーシAI）" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <link rel="icon" href="assets/favicon.ico" />
    <style>
        :root {
            --bg-0: #ffffff;
            --bg-1: #f6fbf8;
            --panel: rgba(255, 255, 255, 0.72);
            --panel-2: rgba(255, 255, 255, 0.88);
            --surface: rgba(0, 0, 0, 0.04);
            --surface-2: rgba(0, 0, 0, 0.06);
            --text: rgba(15, 23, 42, 0.92);
            --muted: rgba(15, 23, 42, 0.62);
            --line: rgba(15, 23, 42, 0.12);
            --accent: #10b981;
            --accent-2: #22c55e;
            --danger: #ef4444;
            --shadow: 0 16px 44px rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family:
                ui-sans-serif,
                system-ui,
                -apple-system,
                'Segoe UI',
                Roboto,
                'Noto Sans JP',
                'Hiragino Kaku Gothic ProN',
                Meiryo,
                Arial,
                sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 30% 10%, rgba(16, 185, 129, 0.16), transparent 55%),
                radial-gradient(circle at 70% 70%, rgba(34, 197, 94, 0.12), transparent 60%),
                linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
            overflow: hidden;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        #app {
            height: 100%;
        }

        .app-shell {
            height: 100%;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px 8px;
        }

        .topbar h1 {
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.25em;
            font-size: 16px;
            opacity: 0.9;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.12);
        }

        .mini-icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            font-weight: 700;
        }

        .content {
            padding: 8px 18px 0;
            overflow: auto;
        }

        .card {
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.7));
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            padding: 16px 16px;
        }

        .card + .card {
            margin-top: 14px;
        }

        .card small {
            color: var(--muted);
            letter-spacing: 0.05em;
        }

        .card-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .card-title strong {
            font-size: 20px;
            font-weight: 650;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-radius: 999px;
            border: 1px solid var(--line);
            padding: 6px 12px;
            background: var(--surface);
            color: var(--muted);
            font-size: 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.14);
        }

        .dot.ok {
            background: var(--accent);
        }

        .primary-btn {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 14px 16px;
            background: linear-gradient(135deg, #0ea371, #0b8e61);
            color: white;
            font-weight: 650;
            letter-spacing: 0.06em;
            cursor: pointer;
            box-shadow: 0 14px 30px rgba(16, 185, 129, 0.22);
        }

        .secondary-btn {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
        }

        .tabs {
            display: flex;
            gap: 8px;
            padding: 6px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--surface);
        }

        .tab {
            flex: 1;
            padding: 10px 10px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .tab.active {
            background: rgba(16, 185, 129, 0.18);
            color: var(--text);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .section {
            margin-top: 14px;
            padding: 14px 14px;
            border-radius: 16px;
            background: var(--panel);
            border: 1px solid var(--line);
        }

        .section h2 {
            margin: 0 0 10px 0;
            font-size: 12px;
            letter-spacing: 0.12em;
            color: var(--muted);
            font-weight: 650;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .row + .row {
            margin-top: 10px;
        }

        .score-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
        }

        .score-side {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-center {
            justify-self: center;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .score-right {
            text-align: right;
        }

        @media (max-width: 420px) {
            .score-row {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
                row-gap: 14px;
            }
            .score-left {
                grid-column: 1;
                grid-row: 1;
            }
            .score-right {
                grid-column: 2;
                grid-row: 1;
            }
            .score-center {
                grid-column: 1 / -1;
                grid-row: 2;
                text-align: center;
                white-space: normal;
                margin-top: 2px;
            }
        }

        .chip {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
        }

        .chip.active {
            border-color: rgba(16, 185, 129, 0.38);
            background: rgba(16, 185, 129, 0.16);
        }

        .input,
        .select,
        .textarea {
            width: 100%;
            padding: 12px 12px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            outline: none;
        }

        .textarea {
            min-height: 84px;
            resize: vertical;
        }

        .board-wrap {
            margin-top: 14px;
            display: grid;
            place-items: center;
            position: relative;
        }

        .board-wrap.with-overlay {
            padding-top: 44px;
        }

        .board-overlay {
            position: absolute;
            top: 0;
            left: 10px;
            display: inline-flex;
            gap: 8px;
            align-items: center;
            z-index: 2;
        }

        .toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.7);
            color: var(--muted);
            cursor: pointer;
            user-select: none;
        }

        .toggle .track {
            width: 34px;
            height: 18px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.12);
            position: relative;
        }

        .toggle .knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.95);
            transition: transform 140ms ease;
        }

        .toggle.on {
            color: var(--text);
            border-color: rgba(16, 185, 129, 0.28);
            background: rgba(16, 185, 129, 0.12);
        }

        .toggle.on .track {
            background: rgba(16, 185, 129, 0.35);
        }

        .toggle.on .knob {
            transform: translateX(16px);
        }

        .board-shell {
            width: min(88vw, 420px);
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 2px;
            padding: 12px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid var(--line);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.12);
        }

        .cell {
            position: relative;
            border: none;
            border-radius: 0;
            background: #0f8a5f;
            cursor: pointer;
            padding: 0;
        }

        .cell.legal {
            outline: 2px solid rgba(0, 0, 0, 0.14);
            outline-offset: -2px;
            background: #11a06d;
        }

        .cell.next-opening {
            outline: 2px solid rgba(251, 146, 60, 0.9);
            outline-offset: -2px;
        }

        .cell.last-move::after {
            content: '';
            position: absolute;
            inset: 12%;
            border-radius: 0;
            border: 2px solid rgba(0, 0, 0, 0.2);
            pointer-events: none;
        }

        .coord {
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 650;
            color: var(--muted);
            user-select: none;
        }

        .stone {
            position: absolute;
            inset: 10%;
            border-radius: 999px;
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
        }

        .stone.black {
            background: #0b0f14;
        }

        .stone.white {
            background: #eef2f7;
        }

        .score {
            font-size: 12px;
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
            pointer-events: none;
            font-weight: 650;
        }

        .tabs-row {
            display: flex;
            justify-content: center;
            gap: 0;
            border-bottom: 1px solid var(--line);
            margin-top: 10px;
        }

        .tabs-row button {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 8px;
            color: var(--muted);
            font-weight: 650;
            letter-spacing: 0.08em;
            cursor: pointer;
        }

        .tabs-row button.active {
            color: var(--text);
            border-bottom: 2px solid rgba(16, 185, 129, 0.7);
        }

        .graph {
            width: 100%;
            height: 120px;
            border-radius: 14px;
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 10px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            max-width: min(92vw, 520px);
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid var(--line);
            color: var(--text);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.14);
            display: none;
            z-index: 50;
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.35);
            background: rgba(254, 226, 226, 0.95);
        }

        .hidden {
            display: none !important;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.25);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 80;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            width: min(560px, 100%);
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.86));
            border: 1px solid var(--line);
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.16);
            padding: 16px;
        }

        .modal-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .modal-title strong {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .divider {
            height: 1px;
            background: var(--line);
            margin: 10px 0;
        }

        .mini {
            font-size: 12px;
            color: var(--muted);
        }

        .controls-bar {
            padding: 12px 12px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            box-shadow: 0 18px 44px rgba(15, 23, 42, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 16px;
        }

        .controls-bar .row {
            margin-top: 0;
        }

        .controls-row {
            display: grid;
            grid-template-columns: auto auto 1fr 1fr;
            align-items: center;
            gap: 10px;
        }

        @media (max-width: 420px) {
            .controls-row {
                grid-template-columns: auto auto;
            }
        }

        .controls-btn {
            height: 34px;
            padding: 0 12px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
            transition:
                transform 120ms ease,
                background-color 120ms ease,
                border-color 120ms ease,
                box-shadow 120ms ease;
        }

        .controls-btn.wide {
            width: 100%;
            justify-self: stretch;
            text-align: center;
        }

        .controls-btn:hover {
            transform: translateY(-1px);
            border-color: rgba(15, 23, 42, 0.2);
            background: rgba(15, 23, 42, 0.05);
            box-shadow: 0 12px 26px rgba(15, 23, 42, 0.14);
        }

        .controls-btn:active {
            transform: translateY(0px);
            box-shadow: none;
        }

        .controls-btn.active {
            border-color: rgba(16, 185, 129, 0.34);
            background: rgba(16, 185, 129, 0.16);
            box-shadow: 0 14px 30px rgba(16, 185, 129, 0.12);
        }

        .controls-icon {
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 12px;
            transition:
                transform 120ms ease,
                background-color 120ms ease,
                border-color 120ms ease,
                box-shadow 120ms ease;
        }

        .controls-icon:hover {
            transform: translateY(-1px);
            border-color: rgba(15, 23, 42, 0.2);
            background: rgba(15, 23, 42, 0.05);
            box-shadow: 0 12px 26px rgba(15, 23, 42, 0.14);
        }

        .controls-icon:active {
            transform: translateY(0px);
            box-shadow: none;
        }

        .analysis-toolbar {
            margin-top: 12px;
            padding: 10px 10px;
            border-radius: 16px;
            background: var(--panel);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .analysis-toolbar-left {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .analysis-toolbar .controls-btn {
            height: 34px;
            padding: 0 12px;
            border-radius: 999px;
        }

        .toolbar-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            align-items: center;
        }

        .toolbar-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .analysis-toolbar button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .analysis-ply-input {
            width: 64px;
            height: 34px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            text-align: center;
            outline: none;
        }
    </style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./index.js"></script>
</body>
</html>
