[package]
name = "deft_reversi_book"
version = "1.0.0-dev.1"
description = "Opening book of Deft Reversi: building, storage and lookup"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
endgame-pattern-ordering = ["deft_reversi_engine/endgame-pattern-ordering"]

[dependencies]
deft_reversi_engine = { path = "../deft-reversi-engine" }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
# The tests build their own models and calibrations.
deft_reversi_engine = { path = "../deft-reversi-engine", features = ["tuning"] }
