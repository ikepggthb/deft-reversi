<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>Deft Reversi</title>
    <meta name="description" content="強いオセロAI（リバーシAI）" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,user-scalable=no" />
    <link rel="icon" href="assets/favicon.ico" />
    <style>
        :root {
            --bg: #edf0f4;
            --panel: #ffffff;
            --text: #1e293b;
            --muted: #8390a3;
            --line: #dfe4ea;
            --accent: #67d9a2;
            --danger: #dc2626;
            --board-gap: 2px;
            --board-pad: 10px;
            --coord-font: 11px;
            --board-frame: #e7f2ed;
            --board-gridline: rgba(33, 108, 92, 0.2);
            --board-tile: #7ec3af;
            --board-tile-legal: #73bea8;
            --board-outline: rgba(100, 116, 139, 0.16);
            --board-last-dot: #ef4444;
            --board-next-opening: #f97316;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: 'Avenir Next', 'Noto Sans JP', 'Hiragino Sans', sans-serif;
            color: var(--text);
            background: radial-gradient(120% 80% at 50% -15%, #f8fafc 0%, var(--bg) 46%, #e6ebf1 100%);
            overflow: hidden;
        }
        button, input, select, textarea { font: inherit; }
        #app { height: 100%; }
        .app-shell { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            padding: 16px 16px 10px;
            background: transparent;
        }
        .topbar h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .content { overflow: auto; padding: 8px 12px 10px; }
        .page { max-width: 760px; margin: 0 auto; }
        .main-grid {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-areas: "board" "graph";
            gap: 12px;
        }
        .status-line,
        .graph-area {
            background: var(--panel);
            border: 1px solid rgba(210, 218, 228, 0.84);
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(88, 101, 125, 0.12);
        }
        .status-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.88);
        }
        .status-player {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1 1 0;
            opacity: 0.84;
            color: var(--muted);
            transition: opacity 120ms ease, color 120ms ease;
        }
        .status-player--white { justify-content: flex-end; text-align: right; }
        .status-player.is-active { font-weight: 700; opacity: 1; color: var(--text); }
        .status-stack { display: grid; gap: 2px; min-width: 0; }
        .status-stack--right { justify-items: end; }
        .status-divider { width: 1px; height: 42px; background: var(--line); flex: 0 0 auto; }
        .stone-dot {
            width: 32px;
            height: 32px;
            border-radius: 999px;
            flex: 0 0 auto;
            border: 2px solid rgba(15, 23, 42, 0.12);
            box-shadow: inset 0 2px 4px rgba(148, 163, 184, 0.22);
        }
        .stone-dot--black { background: #0f172a; }
        .stone-dot--white { background: #f8fafc; }
        .status-player.is-active .status-name,
        .status-player.is-active .status-count { color: #0b1220; font-weight: 700; }
        .status-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 24vw;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .status-count { color: #0f172a; min-width: 2ch; font-variant-numeric: tabular-nums; font-size: 34px; line-height: 1; }
        .board-area {
            grid-area: board;
            display: grid;
            gap: 10px;
            border: 1px solid rgba(210, 218, 228, 0.84);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(88, 101, 125, 0.1);
            background: rgba(255, 255, 255, 0.62);
            padding: 10px 6px;
        }
        .board-tools {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 0 4px;
            flex-wrap: wrap;
        }
        .pending-banner {
            padding: 10px 12px;
            border: 1px solid #d8e2ec;
            border-radius: 12px;
            background: #f8fbfe;
            color: #516172;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }
        .inline-controls {
            display: grid;
            gap: 10px;
            padding: 0;
            background: transparent;
            border: 0;
            box-shadow: none;
            margin-top: 2px;
        }
        .inline-controls__nav {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
        }
        .inline-controls__action {
            display: grid;
        }
        .graph-area { grid-area: graph; padding: 10px; }
        .graph-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .graph-head__title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            min-height: 22px;
            padding: 0 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        .status-badge--running {
            background: #e0f2fe;
            color: #0369a1;
        }
        .status-badge--study {
            background: #ffedd5;
            color: #c2410c;
        }
        .graph {
            width: 100%;
            min-height: 124px;
            border: 1px solid #e3e8ef;
            border-radius: 12px;
            background: linear-gradient(180deg, #f7fafc 0%, #f3f7fb 100%);
            padding: 4px;
        }
        .graph-legend {
            display: flex;
            gap: 12px;
            margin: -2px 0 8px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
        }
        .graph-legend__item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .graph-legend__item::before {
            content: '';
            width: 12px;
            height: 3px;
            border-radius: 999px;
            background: var(--accent);
        }
        .graph-legend__item--study::before {
            background: #f97316;
        }
        .progress-meter {
            display: grid;
            gap: 6px;
            margin-top: 8px;
        }
        .progress-meter--graph {
            margin: -2px 0 8px;
        }
        .progress-meter__label {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
        }
        .progress-meter__track {
            width: 100%;
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
            background: #e6edf5;
            border: 1px solid #dbe5ef;
        }
        .progress-meter__fill {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #2dd4bf 0%, #14b8a6 100%);
            transition: width 120ms ease-out;
        }
        .board-shell {
            display: grid;
            grid-template-columns: repeat(10, minmax(0, 1fr));
            gap: var(--board-gap);
            width: min(92vw, min(560px, 60vh));
            margin: 0 auto;
            padding: var(--board-pad);
            border-radius: 18px;
            border: 1px solid var(--board-outline);
            background: var(--board-frame);
            user-select: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
        }
        .board-shell > * { aspect-ratio: 1 / 1; }
        .cell {
            position: relative;
            border: 1px solid var(--board-gridline);
            border-radius: 3px;
            background: var(--board-tile);
            padding: 0;
            cursor: pointer;
            display: grid;
            place-items: center;
        }
        .cell.legal {
            background: #97d6c4;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
        }
        .cell.next-opening { box-shadow: inset 0 0 0 2px var(--board-next-opening); }
        .cell.last-move::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--board-last-dot);
            bottom: 5px;
            right: 5px;
        }
        .coord { display: grid; place-items: center; font-size: var(--coord-font); color: var(--muted); user-select: none; }
        .stone {
            width: 72%;
            height: 72%;
            border-radius: 999px;
            border: 1px solid rgba(15, 23, 42, 0.24);
            box-shadow: inset 0 2px 6px rgba(15, 23, 42, 0.16);
        }
        .stone.black { background: #0f172a; }
        .stone.white { background: #f8fafc; }
        .cell-eval {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 6px;
            background: transparent;
            color: #0f172a;
            font-size: clamp(11px, 1.25vw, 18px);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1;
        }
        .cell-eval--best { color: #2563eb; }
        .dock {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            padding: 8px 10px 12px;
            border-top: 1px solid #d5dde7;
            background: rgba(251, 253, 255, 0.95);
        }
        .dock-btn,
        .chip,
        .secondary-btn {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fff;
            color: var(--text);
            min-height: 34px;
            padding: 8px 12px;
            cursor: pointer;
        }
        .dock-btn {
            display: grid;
            justify-items: center;
            gap: 2px;
            flex: 1 1 0;
            border: 0;
            background: transparent;
            color: #8b98ac;
            min-height: 52px;
            padding: 2px 0;
            border-radius: 10px;
        }
        .dock-icon { font-size: 11px; line-height: 1; font-weight: 700; letter-spacing: -0.02em; }
        .dock-label { font-size: 11px; font-weight: 700; }
        .inline-controls .chip {
            border-radius: 16px;
            min-width: 0;
            min-height: 44px;
            background: #f9fbfd;
            box-shadow: 0 6px 14px rgba(88, 101, 125, 0.15);
            border-color: #d9e0e8;
            font-size: 14px;
            font-weight: 700;
        }
        .inline-controls .chip--nav {
            background: #ffffff;
            color: #334155;
            box-shadow: 0 5px 12px rgba(88, 101, 125, 0.1);
            padding: 0;
            font-size: 22px;
            line-height: 1;
        }
        .inline-controls .chip--cta {
            min-height: 50px;
            font-size: 15px;
            letter-spacing: 0.01em;
        }
        .inline-controls .chip--primary { background: #1f2b44; color: #f8fafc; border-color: #1f2b44; }
        .chip--study {
            min-height: 38px;
            padding: 8px 14px;
            border-radius: 999px;
            background: #fff1e7;
            border-color: #fdba74;
            color: #9a3412;
            box-shadow: none;
            font-weight: 800;
        }
        .chip--study.active {
            background: #ea580c;
            border-color: #9a3412;
            color: #ffffff;
        }
        .chip--board-eval {
            min-height: 38px;
            padding: 8px 14px;
            border-radius: 999px;
            background: #eff6ff;
            border-color: #bfdbfe;
            color: #1d4ed8;
            box-shadow: none;
            font-weight: 800;
        }
        .chip--board-eval.active {
            background: #1d4ed8;
            border-color: #1e40af;
            color: #ffffff;
        }
        .inline-controls .chip:disabled {
            cursor: default;
            color: #9aa7b5;
            background: #f3f6f8;
            border-color: #e1e7ee;
            box-shadow: none;
        }
        .chip.active { border-color: #82d5bb; background: #e7f8f1; }
        .chip.chip--study.active {
            background: #ea580c;
            border-color: #9a3412;
            color: #ffffff;
        }
        .chip.chip--board-eval.active {
            background: #1d4ed8;
            border-color: #1e40af;
            color: #ffffff;
        }
        .secondary-btn { border-radius: 10px; width: 100%; }
        .secondary-btn--busy {
            background: #eef6ff;
            color: #1d4ed8;
            border-color: #bfdbfe;
            cursor: default;
        }
        .mini { color: var(--muted); font-size: 12px; font-weight: 600; }
        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fff;
            cursor: pointer;
        }
        .panel-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity 160ms ease;
            z-index: 20;
        }
        .panel-overlay.open { opacity: 1; pointer-events: auto; }
        .panel {
            width: min(92vw, 560px);
            margin: 10vh auto;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 18px 38px rgba(88, 101, 125, 0.18);
        }
        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .panel-head--mode {
            padding-bottom: 12px;
            border-bottom: 1px solid #edf2f7;
            margin-bottom: 14px;
        }
        .close-glyph {
            display: inline-block;
            font-size: 24px;
            line-height: 1;
            transform: translateY(-1px);
        }
        .panel-section {
            margin-top: 10px;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            background: #fcfdff;
        }
        .setting-row + .setting-row { margin-top: 10px; }
        .row { display: flex; gap: 8px; align-items: center; }
        .row.wrap { flex-wrap: wrap; }
        .select,
        .textarea,
        input[type='range'] { width: 100%; }
        .select,
        .textarea {
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px 14px;
            background: #fff;
            color: var(--text);
        }
        .mode-panel-section {
            border-radius: 18px;
            padding: 14px;
            background: #fff;
            border-color: #e6edf3;
        }
        .mode-panel-section--flat {
            padding: 0;
            background: transparent;
            border: 0;
        }
        .mode-panel-actions {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 0.95fr);
            gap: 10px;
            align-items: stretch;
        }
        .mode-panel-actions > .secondary-btn {
            width: 100%;
        }
        .panel-section-title {
            margin-bottom: 12px;
            color: #475569;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.02em;
        }
        .mode-chip-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            padding: 4px;
            border-radius: 18px;
            background: #e2ebea;
            border: 1px solid #d3dfdd;
        }
        .mode-chip {
            min-height: 44px;
            border: 1px solid transparent;
            border-radius: 14px;
            background: transparent;
            color: #243243;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }
        .mode-chip.active {
            background: #ffffff;
            color: #0b7f74;
            border-color: #b9d9d4;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.1);
        }
        .stone-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            font-size: 13px;
            font-weight: 700;
        }
        .stone-label::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 999px;
            border: 1px solid rgba(15, 23, 42, 0.18);
            background: #f8fafc;
            flex: 0 0 auto;
        }
        .stone-label--black::before {
            background: #0f172a;
        }
        .stone-label--white::before {
            background: #ffffff;
        }
        .select-label {
            margin-bottom: 10px;
            color: #64748b;
            font-size: 13px;
            font-weight: 700;
        }
        .secondary-btn--hero {
            min-height: 56px;
            border: 0;
            border-radius: 18px;
            background: linear-gradient(180deg, #12a89c 0%, #0e9d91 100%);
            color: #f8fffd;
            font-size: 16px;
            font-weight: 800;
            box-shadow: 0 14px 28px rgba(16, 163, 146, 0.24);
        }
        @media (max-width: 560px) {
            .mode-panel-actions {
                grid-template-columns: 1fr;
            }
        }
        .icon-btn--soft {
            width: 40px;
            height: 40px;
            border: 1px solid #d6e0dc;
            background: #e6efeb;
            color: #334155;
        }
        .icon-btn--soft:hover {
            background: #dde9e4;
        }
        .textarea { min-height: 120px; resize: vertical; }
        .analysis-output {
            margin: 10px 0 0;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: #0f172a;
            font-size: 12px;
            max-height: 220px;
            overflow: auto;
            white-space: pre-wrap;
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 68px;
            transform: translateX(-50%) translateY(10px);
            opacity: 0;
            pointer-events: none;
            color: white;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 12px;
            transition: opacity 160ms ease, transform 160ms ease;
            z-index: 40;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: rgba(220, 38, 38, 0.95); }
        .pass-modal {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.96);
            min-width: 132px;
            padding: 18px 26px;
            border-radius: 22px;
            background: rgba(15, 23, 42, 0.9);
            color: #f8fafc;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-align: center;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.28);
            opacity: 0;
            pointer-events: none;
            transition: opacity 140ms ease, transform 140ms ease;
            z-index: 45;
        }
        .pass-modal.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .result-modal {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.96);
            min-width: 180px;
            padding: 18px 28px;
            border-radius: 22px;
            background: rgba(15, 23, 42, 0.92);
            color: #f8fafc;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.28);
            opacity: 0;
            pointer-events: none;
            transition: opacity 140ms ease, transform 140ms ease;
            z-index: 46;
        }
        .result-modal.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        @media (max-width: 640px) {
            .status-name { max-width: 26vw; }
            .status-count { font-size: 32px; }
            .pass-modal {
                min-width: 116px;
                font-size: 24px;
            }
            .result-modal {
                min-width: 152px;
                font-size: 20px;
            }
        }
        @media (min-width: 1024px) and (min-aspect-ratio: 13/10) {
            .page { max-width: 1180px; }
            .main-grid {
                grid-template-columns: minmax(520px, 1fr) minmax(320px, 0.58fr);
                gap: 12px;
                grid-template-areas: "board graph";
                align-items: start;
            }
            .graph-area { margin-top: 0; position: sticky; top: 10px; }
            .board-shell { width: min(100%, min(640px, 62vh)); }
        }
    </style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./index.js"></script>
</body>
</html>
