[package]
name = "deft_reversi_train"
version = "0.1.0"
edition = "2024"
readme = "README.md"

[[bin]]
name = "deft-reversi-train"
path = "src/main.rs"

[dependencies]
bincode = "1.3"
clap = { version = "4.5.23", features = ["derive"] }
deft_reversi_engine = { path = "../deft-reversi-engine", features = ["tuning"] }
rand = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
