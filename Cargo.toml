[workspace]
members = ["deft-reversi-engine", "deft-reversi-book", "deft-reversi-train", "deft-reversi-desktop"]
# These applications still use the legacy API and require migration.
exclude = ["deft-reversi-cli", "deft-reversi-web"]
resolver = "2"

[profile.release]
lto = "fat"
opt-level = 3
# YBWC jobs drain their children and report worker failures on unwind.
panic = 'unwind'
codegen-units = 1

# GPUI builds against these forks in Zed; patches do not carry over from a
# dependency's workspace.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }
