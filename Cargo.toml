[workspace]
members = ["deft-reversi-engine", "deft-reversi-book", "deft-reversi-train", "deft-reversi-cli"]
# The web application still uses the legacy API and requires migration.
exclude = ["deft-reversi-web"]
resolver = "2"

[workspace.package]
version = "1.0.0-dev.1"

[profile.release]
lto = "fat"
opt-level = 3
# YBWC jobs drain their children and report worker failures on unwind.
panic = 'unwind'
codegen-units = 1
