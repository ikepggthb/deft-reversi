[workspace]
members = ["deft-reversi-engine", "deft-reversi-book", "deft-reversi-wasm-engine"]
# These applications still use the legacy API and require migration.
exclude = ["deft-reversi-cli", "deft-reversi-web", "deft-reversi-learn"]
resolver = "2"

[profile.release]
lto = "fat"
opt-level = 3
# YBWC jobs drain their children and report worker failures on unwind.
panic = 'unwind'
codegen-units = 1
