[package]
name = "deft_reversi_engine"
version = "2.0.0-dev.1"
description = "Reversi engine of Deft Reversi: pattern evaluation and parallel midgame and endgame search"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Model construction, MPC configuration and ProbCut rules, for tuning tools.
tuning = []
# Experimental: main-model pattern weights are not calibrated for ordering.
endgame-pattern-ordering = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

[dev-dependencies]
# The tests build their own models and calibrations.
deft_reversi_engine = { path = ".", features = ["tuning"] }
