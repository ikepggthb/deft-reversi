[package]
name = "deft_reversi_engine"
version = "2.0.0"
edition = "2024"
readme = "README.md"

[features]
# Experimental: main-model pattern weights are not calibrated for ordering.
endgame-pattern-ordering = []
book-cli = ["dep:ctrlc"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
sha2 = "0.10"
ctrlc = { version = "3.4", optional = true }

[[bin]]
name = "book"
path = "src/bin/book.rs"
required-features = ["book-cli"]
