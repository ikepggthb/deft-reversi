[package]
name = "deft_reversi_engine"
version = "2.0.0"
edition = "2024"
readme = "README.md"

[features]
# Model construction, MPC configuration and ProbCut rules, for tuning tools.
tuning = []
# Experimental: main-model pattern weights are not calibrated for ordering.
endgame-pattern-ordering = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

[dev-dependencies]
# The tests build their own models and calibrations.
deft_reversi_engine = { path = ".", features = ["tuning"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
