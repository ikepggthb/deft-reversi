[package]
name = "deft-reversi-cli"
version = "1.0.0-dev.1"
description = "Command-line interface of Deft Reversi: play, analysis, books, GTP and the FlipSight bot"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.5.23", features = ["derive", "env"] }
ctrlc = "3.4"
deft_reversi_book = { path = "../deft-reversi-book" }
deft_reversi_engine = { path = "../deft-reversi-engine", features = ["tuning"] }
rand = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
# GTP logs each move's time budget and completed iterations to stderr.
trace = []
endgame-pattern-ordering = ["deft_reversi_book/endgame-pattern-ordering"]
