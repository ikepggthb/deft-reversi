[package]
name = "deft-reversi-cli"
version.workspace = true
edition = "2024"

[dependencies]
clap = { version = "4.5.23", features = ["derive", "env"] }
ctrlc = "3.4"
deft_reversi_book = { path = "../deft-reversi-book" }
deft_reversi_engine = { path = "../deft-reversi-engine", features = ["tuning"] }
rand = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
endgame-pattern-ordering = ["deft_reversi_book/endgame-pattern-ordering"]
