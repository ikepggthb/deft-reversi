[package]
name = "deft_reversi_desktop"
version = "1.0.0-beta.1"
description = "Desktop application of Deft Reversi"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "deft-reversi"
path = "src/main.rs"

[dependencies]
deft_reversi_engine = { path = "../deft-reversi-engine" }
deft_reversi_book = { path = "../deft-reversi-book" }
# GPUI is pre-1.0: both crates come from the same Zed release tag.
gpui = { git = "https://github.com/zed-industries/zed.git", tag = "v1.29.3", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", tag = "v1.29.3", features = ["wayland", "x11"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS data and config folders.
dirs = "6"
# Saved times are shown in the local time zone.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Sound effects are made in code, so only playback is needed.
rodio = { version = "0.23", default-features = false, features = ["playback"] }

[features]
# Frame times while discs turn and search results go to stderr.
trace = []

[build-dependencies]
# The icon and version information of the Windows executable.
winresource = "0.1"

[dev-dependencies]
# Tests build a small engine from the zero model with known ProbCut rules.
deft_reversi_engine = { path = "../deft-reversi-engine", features = ["tuning"] }
