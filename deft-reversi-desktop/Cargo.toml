[package]
name = "deft_reversi_desktop"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "deft-reversi"
path = "src/main.rs"

[dependencies]
deft_reversi_engine = { path = "../deft-reversi-engine" }
# GPUI is pre-1.0: both crates come from the same Zed release tag.
gpui = { git = "https://github.com/zed-industries/zed.git", tag = "v0.233.10", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", tag = "v0.233.10", features = ["wayland", "x11"] }
async-channel = "2"
