[package]
name = "deft-reversi-wasm-engine"
version = "2.0.0"
edition = "2024"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
bincode = "1.3"
web-time = "1"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
deft-reversi-wasm-engine = { path = ".", features = ["tuning"] }
wasm-bindgen-test = "0.3"

[features]
tuning = []
endgame-pattern-ordering = []
